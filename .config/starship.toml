"$schema" = 'https://starship.rs/config-schema.json'

format = """
┌ $os\
$time\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$nodejs\
$java\
$kotlin\
$python\
$dart\
$sudo\
$line_break└ $username@$directory $character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'
color_c = '#085EA0'

[os]
disabled = true
style = "bg:color_blue fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Mint = "󰣭"
Linux = "󰌽"
Fedora = "󰣛"
Android = ""
Arch = "󰣇"
EndeavourOS = ""

[username]
show_always = true
style_user = "bg:transparent fg:#00bfff"
style_root = "bg:color_blue fg:color_fg0"
format = '[$user]($style)'

[directory]
format = "[$path]($style)"
truncate_to_repo = true
home_symbol = "󰋞"

[directory.substitutions]
"documents" = "󰈙"
"downloads" = ""
"music" = "󰝚"
"pictures" = ""
"programming" = ""
"games" = "󰊗"

style = "bold fg:0"

[git_branch]
symbol = ""
style = "bold fg:red"
format = ' - [$symbol $branch]($style)'

[git_status]
style = "fg:red"
format = '[ $all_status$ahead_behind]($style)'

[nodejs]
symbol = ""
style = "bg:color_red"
format = ' - [[ $symbol( $version) ](fg:color_fg0 bg:color_green)]($style)'

[c]
symbol = " "
style = "bg:color_red"
format = ' - [[ $symbol( $version) ](fg:color_fg0 bg:color_c)]($style)'

[cpp]
symbol = " "
style = "bg:color_red"
format = ' - [[ $symbol( $version) ](fg:color_fg0 bg:color_c)]($style)'

[rust]
symbol = ""
# style = "bg:color_red"
format = ' - [$symbol ($version) ]($style)'

[kotlin]
symbol = ""
style = "bg:color_red"
format = ' - [[ $symbol( $version) ](fg:color_fg0 bg:color_red)]($style)'

[python]
symbol = ""
# style = "bg:color_red"
format = ' - [$symbol( $version) | $virtualenv]($style)'

[dart]
symbol = "🎯"
# style = "bg:color_red"
format = ' - [[$symbol( $version)](fg:#2cb7f6)]($style)'

[time]
disabled = false
time_format = "%r"
style = "bold fg:green"
format = '[$time]($style)'

[character]

success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
